name: CI

on:
  push:
    branches: [main, "melhorias-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check app main.py scripts

  tests:
    name: Testes (unitários + SQLite)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest (exceto integração Postgres)
        run: pytest -m "not integration" --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  integration:
    name: Integração (PostgreSQL 16)
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: etl_db
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: etl_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_user -d etl_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://etl_user:etl_pass@localhost:5432/etl_db
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrações (upgrade → downgrade → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: pytest -m integration
        run: pytest -m integration -rs
      - name: Pipeline real via CLI (sem API externa)
        env:
          FX_ENABLED: "false"
        run: |
          python main.py run-etl
          ls -l reports/

  docker:
    name: Docker (build + smoke test do compose)
    runs-on: ubuntu-latest
    needs: [tests, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Permissões dos bind mounts
        # O runner usa UID 1001 e o container roda como UID 1000 (usuário não-root `app`).
        run: chmod 777 logs reports
      - name: Subir postgres + backend
        run: docker compose up -d --build --wait postgres backend
      - name: Smoke test da API
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -X POST http://localhost:8000/etl/run | tee etl.json
          python3 -c "import json; d=json.load(open('etl.json')); assert d['rows_transformed'] > 0, d"
          curl -fsS http://localhost:8000/reports/snapshot > /dev/null
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v
