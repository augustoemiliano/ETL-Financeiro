[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: testes que exigem PostgreSQL real (DATABASE_URL postgresql; pulados sem servidor)",
]
addopts = "-q --tb=short"
filterwarnings = [
    # Aviso interno do Starlette sobre o backend httpx do TestClient (externo ao projeto).
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
