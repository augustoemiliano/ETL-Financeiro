# Credenciais abaixo são defaults de DEMONSTRAÇÃO. Para qualquer uso real, defina
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB em um `.env` (lido automaticamente pelo Compose).

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-etl_user}:${POSTGRES_PASSWORD:-etl_pass}@postgres:5432/${POSTGRES_DB:-etl_db}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SCHEDULER_RUN_TIME: ${SCHEDULER_RUN_TIME:-02:05}
  FX_API_BASE_URL: ${FX_API_BASE_URL:-https://api.frankfurter.app}
  FX_ENABLED: ${FX_ENABLED:-true}
  CSV_INPUT_DIR: data/samples
  XLSX_INPUT_DIR: data/samples

x-app-volumes: &app-volumes
  - ./logs:/app/logs:rw,z
  - ./reports:/app/reports:rw,z
  # CSV/XLSX: `:z` relabel SELinux (Fedora) para o container poder ler o bind mount.
  - ./data:/app/data:ro,z

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-etl_db}
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_pass}
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: etl-financeiro:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    volumes: *app-volumes
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    profiles: ["cron"]
    image: etl-financeiro:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *app-env
    volumes: *app-volumes
    command: ["scheduler"]

volumes:
  postgres-data:
